[project]
name = "sim-agent"
version = "0.1.0"
description = "OpenArm v2 embodied AI agent on Genesis World, with AI planning, graph memory, and a web dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143.3",
    # The physics engine. It brings MuJoCo along as a dependency and parses the official MJCF with
    # it; this project reads the model's sites, keyframe and actuator mapping the same way.
    "genesis-world>=1.4.4",
    "httpx>=0.28.1",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "openai>=3.33.0",
    "openarm-mujoco>=2.3.0",
    "pillow>=11.0.0,<12.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "torch",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
# `backend` and `tests` are namespace packages (no __init__.py at the project root), so pytest's
# prepend import mode does not put the project root on sys.path. This makes `uv run pytest -q`
# work from a clean checkout on any machine.
pythonpath = ["."]

